version: 2

models:
  - name: stg_accounts
    columns:
      - name: account_id
        tests:
          - unique
          - not_null

  - name: stg_plaid__transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null

  - name: stg_legacy__transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: stg_plaid__securities
    columns:
      - name: security_id
        tests:
          - unique
          - not_null

  - name: stg_plaid__investment_transactions
    columns:
      - name: investment_transaction_id
        tests:
          - unique
          - not_null
