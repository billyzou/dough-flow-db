version: 2

seeds:
  - name: categories
    description: Our category taxonomy. category_id is referenced by category_map and bronze.category_overrides.
    config:
      column_types:
        category_id: integer
    columns:
      - name: category_id
        tests:
          - unique
          - not_null

  - name: category_map
    description: Source category label (Plaid PFC primary or detailed, or the bank CSV's category) -> our category. A detailed match wins over the primary.
    config:
      column_types:
        category_id: integer
    columns:
      - name: external_category
        tests:
          - unique
          - not_null
