version: '3.8'

x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow_meta
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__SESSION_COOKIE_NAME: airflow_session
    DB_HOST: postgres
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./dough_flow_db:/opt/airflow/dough_flow_db
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:14
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/docker-init/01_airflow_meta.sql:/docker-entrypoint-initdb.d/01_airflow_meta.sql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/03_schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@localhost"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file: .env
    environment:
      DB_HOST: postgres
      # llama-server on the host Mac, for the Ask tab (the demo leaves it unset, so it has no Ask tab)
      LLM_URL: http://host.docker.internal:8081
    volumes:
      - ./dashboard:/app
    command: streamlit run /app/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Demo: the dashboard on a made-up household, to show people (demo/generate.py) ----------
  # Kept apart from the real data: its own Postgres and volume, its own network (the real services
  # aren't on it, so no demo container can reach the real `postgres`), and its own throwaway
  # credentials written here. No demo service gets env_file, so none can read .env.
  postgres-demo:
    image: postgres:14
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: dough_flow_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./demo/demo_marker.sql:/docker-entrypoint-initdb.d/02_demo_marker.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo", "-d", "dough_flow_demo"]
      interval: 5s
      retries: 5
    networks: [demo]
    restart: unless-stopped

  # Regenerates the fake bronze data and runs the real dbt models on it every morning (demo/refresh.sh)
  demo-pipeline:
    build: .
    entrypoint: ["bash", "/demo/refresh.sh"]
    environment: &demo-db
      DB_HOST: postgres-demo
      DB_PORT: 5432
      DB_NAME: dough_flow_demo
      DB_USER: demo
      DB_PASSWORD: demo
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./demo:/demo:ro
      - ./dough_flow_db:/demo-dbt:ro
    networks: [demo]
    depends_on:
      postgres-demo:
        condition: service_healthy
    restart: unless-stopped

  streamlit-demo:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      <<: *demo-db
      DOUGH_FLOW_DEMO: "1"
    volumes:
      - ./dashboard:/app:ro
    command: streamlit run /app/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8502:8501"
    networks: [demo]
    depends_on:
      postgres-demo:
        condition: service_healthy
    restart: unless-stopped

networks:
  demo:

volumes:
  postgres_data:
  airflow_logs:
  demo_postgres_data:
